<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- 왼쪽 상단 장식: 블럭을 가지고 노는 초록 공룡 (SVG) -->
    <div class="dino-corner" aria-hidden="true">
      <svg class="dino-svg" viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg">
        <!-- 꼬리 -->
        <path d="M30 78 Q10 74 8 88 Q18 84 26 86 Z" fill="#5cb85c" />

        <!-- 몸통 -->
        <ellipse cx="52" cy="70" rx="26" ry="22" fill="#6ac46a" />

        <!-- 등에 난 삼각 돌기 -->
        <path d="M40 50 l6 -12 l6 12 Z" fill="#4ca64c" />
        <path d="M52 47 l6 -13 l6 13 Z" fill="#4ca64c" />
        <path d="M64 50 l6 -12 l6 12 Z" fill="#4ca64c" />

        <!-- 머리 -->
        <circle cx="74" cy="46" r="20" fill="#6ac46a" />

        <!-- 눈 흰자 + 눈동자 -->
        <circle cx="80" cy="42" r="6" fill="#ffffff" />
        <circle cx="82" cy="43" r="3" fill="#2b2b2b" />

        <!-- 볼터치 -->
        <circle cx="68" cy="52" r="3.5" fill="#f6a5b8" opacity="0.7" />

        <!-- 입가 미소 -->
        <path d="M70 56 Q76 60 84 55" stroke="#3c7a3c" stroke-width="2"
              fill="none" stroke-linecap="round" />

        <!-- 앞다리 (블럭 쪽으로 뻗음) -->
        <rect x="44" y="84" width="9" height="16" rx="4" fill="#5cb85c" />
        <!-- 뒷다리 -->
        <rect x="60" y="86" width="9" height="14" rx="4" fill="#5cb85c" />

        <!-- 가지고 노는 블럭들 (이 그룹만 통통 튀는 애니메이션) -->
        <g class="dino-blocks">
          <rect x="14" y="92" width="14" height="14" rx="3" fill="#ff8c42" />
          <rect x="30" y="92" width="14" height="14" rx="3" fill="#4a90d9" />
          <rect x="22" y="78" width="14" height="14" rx="3" fill="#f5c542" />
        </g>
      </svg>
    </div>

    <h1 class="title">Todo List</h1>

    <!-- 주간 네비게이션: 이전 주 + 주 범위 표시 + 다음 주 -->
    <div class="week-header">
      <button id="prevWeekButton" class="week-nav-button">◀</button>
      <span id="weekRangeText" class="week-range"></span>
      <button id="nextWeekButton" class="week-nav-button">▶</button>
    </div>

    <!-- 주간 뷰: 월~일 7개의 날짜가 가로로 나열됨 (JS로 생성) -->
    <div id="weekView" class="week-view"></div>

    <!-- 할 일 입력 영역: 입력창 + 추가 버튼 -->
    <div class="input-section">
      <input type="text" id="todoInput" placeholder="할 일을 입력하세요" />
      <button id="addButton">추가</button>
    </div>

    <!-- 입력값이 비어있을 때 보여줄 안내 메시지 -->
    <p id="errorMessage" class="error-message"></p>

    <!-- 상태별 필터 탭: data-filter 값으로 어떤 필터인지 구분 -->
    <div class="filter-tabs">
      <button class="tab active" data-filter="all">전체</button>
      <button class="tab" data-filter="active">진행 중</button>
      <button class="tab" data-filter="completed">완료</button>
    </div>

    <!-- 생성된 Todo가 표시될 목록 -->
    <ul id="todoList" class="todo-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
